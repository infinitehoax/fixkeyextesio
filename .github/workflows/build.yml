name: Build Extension Zip

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package extension into zip
        run: zip -r extension.zip manifest.json content.js README.md

      - name: Upload extension zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: extension.zip
